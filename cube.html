<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cube — Three.js</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0f1a;
      overflow: hidden;
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    }
    canvas { display: block; }

    .overlay {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #8fa3c0;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-align: center;
      pointer-events: none;
    }
    .overlay span {
      color: #10b981;
      font-weight: 600;
    }

    .controls {
      position: fixed;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid #1e2a45;
      background: rgba(10, 15, 26, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #8fa3c0;
      font-size: 1.1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ctrl-btn:hover {
      border-color: #10b981;
      color: #10b981;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
    }

    .ctrl-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px #0a0f1a, 0 0 0 6px #10b981;
    }

    .ctrl-btn[aria-pressed="true"] {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #10b981;
    }

    .ctrl-btn:active {
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .ctrl-btn { transition: none; }
      .ctrl-btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <button class="ctrl-btn" id="pauseBtn" aria-pressed="false" aria-label="Pause animation" title="Pause / Resume">
      <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l10.5-6.86a1.03 1.03 0 0 0 0-1.76L9.56 4.26A1.03 1.03 0 0 0 8 5.14z"/></svg>
    </button>
    <button class="ctrl-btn" id="resetBtn" aria-label="Reset camera" title="Reset view">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div class="overlay">Drag to rotate &middot; <span>Three.js</span></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- Scene setup ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0f1a, 0.035);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    const defaultCamPos = new THREE.Vector3(4, 3, 6);
    camera.position.copy(defaultCamPos);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'Interactive 3D rotating cube with glass-like material, floating particles, and dynamic lighting. Drag to rotate.');
    document.body.appendChild(renderer.domElement);

    // --- Cube group ---
    const cubeGroup = new THREE.Group();
    scene.add(cubeGroup);

    // Main cube with physical material
    const cubeGeometry = new THREE.BoxGeometry(2, 2, 2, 4, 4, 4);
    const cubeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x10b981,
      metalness: 0.3,
      roughness: 0.15,
      transmission: 0.6,
      thickness: 1.5,
      ior: 1.5,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      envMapIntensity: 1.5,
    });
    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
    cube.castShadow = true;
    cube.receiveShadow = true;
    cubeGroup.add(cube);

    // Wireframe overlay
    const wireframeGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(2.02, 2.02, 2.02));
    const wireframeMaterial = new THREE.LineBasicMaterial({ color: 0x6ee7b7, transparent: true, opacity: 0.4 });
    const wireframe = new THREE.LineSegments(wireframeGeometry, wireframeMaterial);
    cubeGroup.add(wireframe);

    // Inner glow cube
    const innerGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
    const innerMaterial = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.08 });
    const innerCube = new THREE.Mesh(innerGeometry, innerMaterial);
    cubeGroup.add(innerCube);

    // --- Floating particles ---
    const particleCount = 200;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

      const color = new THREE.Color();
      color.setHSL(0.42 + Math.random() * 0.08, 0.8, 0.5 + Math.random() * 0.3);
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.04,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending,
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // --- Ground plane ---
    const groundGeometry = new THREE.PlaneGeometry(30, 30);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x0a0f1a,
      metalness: 0.8,
      roughness: 0.4,
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -2.5;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Lighting ---
    const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2);
    keyLight.position.set(5, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 50;
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x10b981, 1.5);
    rimLight.position.set(-5, 3, -5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0x3b82f6, 1, 20);
    fillLight.position.set(-3, -2, 4);
    scene.add(fillLight);

    // --- Environment map ---
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    const envGeo = new THREE.SphereGeometry(10, 32, 32);
    const envMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true });
    const envColors = [];
    const envPos = envGeo.attributes.position;
    for (let i = 0; i < envPos.count; i++) {
      const y = envPos.getY(i) / 10;
      const color = new THREE.Color();
      color.setHSL(0.45 + y * 0.1, 0.6, 0.15 + (y + 1) * 0.2);
      envColors.push(color.r, color.g, color.b);
    }
    envGeo.setAttribute('color', new THREE.Float32BufferAttribute(envColors, 3));
    const envMesh = new THREE.Mesh(envGeo, envMat);
    envScene.add(envMesh);
    const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
    scene.environment = envMap;

    // --- Reduced motion detection ---
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let isPaused = prefersReducedMotion;

    // --- Controls ---
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');

    function updatePauseUI() {
      pauseBtn.setAttribute('aria-pressed', isPaused);
      pauseIcon.style.display = isPaused ? 'none' : 'block';
      playIcon.style.display = isPaused ? 'block' : 'none';
      pauseBtn.setAttribute('aria-label', isPaused ? 'Resume animation' : 'Pause animation');
    }

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      updatePauseUI();
    });

    resetBtn.addEventListener('click', () => {
      targetRotationX = 0;
      targetRotationY = 0;
      camera.position.copy(defaultCamPos);
      camera.lookAt(0, 0, 0);
    });

    // Initialize UI for reduced motion
    if (prefersReducedMotion) {
      updatePauseUI();
    }

    // --- Mouse interaction ---
    let mouseX = 0;
    let mouseY = 0;
    let targetRotationX = 0;
    let targetRotationY = 0;
    let isDragging = false;
    let previousMouseX = 0;
    let previousMouseY = 0;

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const deltaX = e.clientX - previousMouseX;
        const deltaY = e.clientY - previousMouseY;
        targetRotationY += deltaX * 0.005;
        targetRotationX += deltaY * 0.005;
        previousMouseX = e.clientX;
        previousMouseY = e.clientY;
      } else {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
      }
    });

    document.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMouseX = e.clientX;
      previousMouseY = e.clientY;
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Touch support
    document.addEventListener('touchstart', (e) => {
      isDragging = true;
      previousMouseX = e.touches[0].clientX;
      previousMouseY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (isDragging) {
        const deltaX = e.touches[0].clientX - previousMouseX;
        const deltaY = e.touches[0].clientY - previousMouseY;
        targetRotationY += deltaX * 0.005;
        targetRotationX += deltaY * 0.005;
        previousMouseX = e.touches[0].clientX;
        previousMouseY = e.touches[0].clientY;
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      isDragging = false;
    });

    // --- Animation (delta-based for frame-rate independence) ---
    const clock = new THREE.Clock();
    const ROTATION_SPEED = 0.5;
    const FLOAT_SPEED = 0.8;
    const PULSE_SPEED = 1.2;
    const LERP_FACTOR = 0.05;

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      if (!isPaused) {
        // Smooth auto-rotation
        if (!isDragging) {
          targetRotationY += ROTATION_SPEED * delta;
          targetRotationX = Math.sin(elapsed * 0.3) * 0.15;
        }

        // Smooth interpolation
        cubeGroup.rotation.x += (targetRotationX - cubeGroup.rotation.x) * LERP_FACTOR;
        cubeGroup.rotation.y += (targetRotationY - cubeGroup.rotation.y) * LERP_FACTOR;

        // Floating motion
        cubeGroup.position.y = Math.sin(elapsed * FLOAT_SPEED) * 0.15;

        // Subtle scale pulse
        const scale = 1 + Math.sin(elapsed * PULSE_SPEED) * 0.02;
        cubeGroup.scale.set(scale, scale, scale);

        // Rotate particles slowly
        particles.rotation.y = elapsed * 0.02;
        particles.rotation.x = elapsed * 0.01;

        // Animate inner cube
        innerCube.rotation.x = -elapsed * 0.5;
        innerCube.rotation.y = -elapsed * 0.3;
        innerMaterial.opacity = 0.05 + Math.sin(elapsed * 2) * 0.03;

        // Animate wireframe opacity
        wireframeMaterial.opacity = 0.3 + Math.sin(elapsed * 1.5) * 0.15;
      }

      // Camera subtle movement (always active for parallax)
      camera.position.x = defaultCamPos.x + mouseX * 0.5;
      camera.position.y = defaultCamPos.y + mouseY * 0.3;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();

    // --- Resize handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
